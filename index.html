<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doc To Speech - Sách Nói Dành Cho iPhone</title>

    <!-- Thư viện đọc Word DOCX -->
    <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>

    <!-- Thư viện đọc PDF.js tương thích tốt nhất với iOS/Safari -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            font-size: 24px;
            color: #333;
        }

        .file-box {
            border: 2px dashed #007aff;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            background: #f0f7ff;
        }

        .file-box input {
            display: none;
        }

        .custom-file-upload {
            display: inline-block;
            padding: 10px 20px;
            background: #007aff;
            color: white;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        #fileName {
            margin-top: 10px;
            font-weight: bold;
            color: #333;
            word-break: break-all;
        }

        textarea {
            width: 100%;
            height: 280px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            resize: vertical;
            font-size: 16px;
            line-height: 1.6;
        }

        .controls {
            margin-top: 15px;
        }

        .control-row {
            margin-bottom: 12px;
        }

        label {
            font-weight: bold;
            color: #444;
        }

        select, input[type="range"] {
            width: 100%;
            margin-top: 6px;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            flex: 1;
            padding: 14px 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .play { background: #28a745; color: white; }
        .pause { background: #ffc107; color: #333; }
        .stop { background: #dc3545; color: white; }

        #status {
            margin-top: 15px;
            padding: 12px;
            background: #eef2f5;
            border-radius: 8px;
            font-size: 14px;
            color: #333;
            text-align: center;
        }

        .info {
            color: #666;
            font-size: 13px;
            margin-top: 6px;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>📖 Doc To Speech</h1>

    <!-- KHU VỰC CHỌN FILE -->
    <div class="file-box">
        <div>📂 <strong>Chọn file sách cần đọc</strong></div>
        <label for="fileInput" class="custom-file-upload">
            📁 Bấm vào đây để chọn File
        </label>
        <input type="file" id="fileInput" accept=".txt,.docx,.pdf">
        <div id="fileName">Chưa chọn file</div>
        <div class="info">Hỗ trợ tốt trên iPhone: TXT, Word DOCX, PDF</div>
    </div>

    <!-- Ô HIỂN THỊ VĂN BẢN -->
    <textarea id="textInput" placeholder="Nội dung sách sẽ xuất hiện ở đây hoặc bạn có thể dán trực tiếp vào..."></textarea>

    <!-- CÁC NÚT ĐIỀU CHỈNH -->
    <div class="controls">
        <div class="control-row">
            <label>🌐 Ngôn ngữ đọc</label>
            <select id="language">
                <option value="vi-VN" selected>🇻🇳 Tiếng Việt</option>
                <option value="en-US">🇺🇸 Tiếng Anh (English)</option>
                <option value="zh-CN">🇨🇳 Tiếng Trung (中文)</option>
            </select>
        </div>

        <div class="control-row">
            <label>⚡ Tốc độ đọc: <span id="speedValue">1</span>x</label>
            <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1">
        </div>
    </div>

    <!-- NÚT ĐIỀU KHIỂN -->
    <div class="buttons">
        <button class="play" onclick="playSpeech()">▶ Đọc</button>
        <button class="pause" onclick="pauseSpeech()">⏸ Tạm dừng</button>
        <button class="stop" onclick="stopSpeech()">⏹ Dừng</button>
    </div>

    <!-- BÁO TRẠNG THÁI -->
    <div id="status">Trạng thái: Sẵn sàng...</div>
</div>

<script>
    const fileInput = document.getElementById("fileInput");
    const fileName = document.getElementById("fileName");
    const textInput = document.getElementById("textInput");
    const speedSlider = document.getElementById("speed");
    const speedValue = document.getElementById("speedValue");

    fileInput.addEventListener("change", handleFile);
    speedSlider.addEventListener("input", function() {
        speedValue.textContent = this.value;
    });

    // XỬ LÝ ĐỌC FILE
    async function handleFile(event) {
        const file = event.target.files[0];
        if (!file) return;

        fileName.textContent = "📄 " + file.name;
        updateStatus("⏳ Đang tải file lên...");

        try {
            const ext = file.name.toLowerCase().split(".").pop();

            if (ext === "txt") {
                const text = await file.text();
                textInput.value = text;
                updateStatus("✅ Đã đọc xong file TXT.");
            } 
            else if (ext === "docx") {
                const arrayBuffer = await file.arrayBuffer();
                const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                textInput.value = result.value;
                updateStatus("✅ Đã đọc xong file Word.");
            } 
            else if (ext === "pdf") {
                updateStatus("⏳ Đang giải mã PDF (Tối ưu cho iPhone)...");
                await extractPdfTextOptimized(file);
            } 
            else {
                updateStatus("❌ File không đúng định dạng hỗ trợ.");
            }
        } catch (error) {
            console.error(error);
            updateStatus("❌ Lỗi khi đọc file: " + error.message);
        }
    }

    // HÀM ĐỌC PDF TỐI ƯU BỘ NHỚ CHO IPHONE
    async function extractPdfTextOptimized(file) {
        const arrayBuffer = await file.arrayBuffer();
        const typedarray = new Uint8Array(arrayBuffer);

        const loadingTask = pdfjsLib.getDocument({ data: typedarray });
        const pdf = await loadingTask.promise;

        let fullText = "";
        const totalPages = pdf.numPages;

        for (let i = 1; i <= totalPages; i++) {
            updateStatus(`⏳ Đang xử lý trang ${i} / ${totalPages}...`);
            const page = await pdf.getPage(i);
            const textContent = await page.getTextContent();
            const pageText = textContent.items.map(item => item.str).join(" ");
            fullText += pageText + "\n\n";

            // Hiển thị dần dần lên màn hình để không làm đơ máy
            if (i % 5 === 0 || i === totalPages) {
                textInput.value = fullText;
            }
        }

        updateStatus(`✅ Đã đọc xong ${totalPages} trang PDF!`);
    }

    /* =================================
       PHẦN XỬ LÝ GIỌNG ĐỌC (TTS)
    ================================= */
    let speech = null;
    let voices = [];
    let textChunks = [];
    let currentChunkIndex = 0;
    let isReading = false;

    function loadVoices() {
        voices = window.speechSynthesis.getVoices();
    }
    window.speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();

    function findVoice(lang) {
        if (!voices.length) voices = window.speechSynthesis.getVoices();
        return voices.find(v => v.lang.toLowerCase() === lang.toLowerCase()) ||
               voices.find(v => v.lang.toLowerCase().startsWith(lang.split('-')[0])) || null;
    }

    function splitText(text, maxLength = 800) {
        text = text.replace(/\s+/g, " ").trim();
        if (!text) return [];
        if (text.length <= maxLength) return [text];

        let chunks = [];
        let remaining = text;

        while (remaining.length > maxLength) {
            let cutPos = remaining.lastIndexOf(". ", maxLength);
            if (cutPos < 200) cutPos = remaining.lastIndexOf(" ", maxLength);
            if (cutPos <= 0) cutPos = maxLength;

            chunks.push(remaining.substring(0, cutPos + 1).trim());
            remaining = remaining.substring(cutPos + 1).trim();
        }
        if (remaining) chunks.push(remaining);
        return chunks;
    }

    function playSpeech() {
        const text = textInput.value.trim();
        const lang = document.getElementById("language").value;
        const speed = parseFloat(speedSlider.value);

        if (!text) {
            alert("Vui lòng dán nội dung hoặc chọn file trước!");
            return;
        }

        if (window.speechSynthesis.paused && isReading) {
            window.speechSynthesis.resume();
            updateStatus("🔊 Đang tiếp tục đọc...");
            return;
        }

        window.speechSynthesis.cancel();
        textChunks = splitText(text);
        currentChunkIndex = 0;
        isReading = true;

        speakChunk(lang, speed);
    }

    function speakChunk(lang, speed) {
        if (currentChunkIndex >= textChunks.length || !isReading) {
            isReading = false;
            updateStatus("✅ Đã đọc xong toàn bộ!");
            return;
        }

        const chunkText = textChunks[currentChunkIndex];
        speech = new SpeechSynthesisUtterance(chunkText);
        speech.lang = lang;
        speech.rate = speed;

        const selectedVoice = findVoice(lang);
        if (selectedVoice) speech.voice = selectedVoice;

        updateStatus(`🔊 Đang đọc phần ${currentChunkIndex + 1} / ${textChunks.length}...`);

        speech.onend = function() {
            currentChunkIndex++;
            speakChunk(lang, speed);
        };

        speech.onerror = function(e) {
            console.error(e);
            updateStatus("❌ Lỗi giọng đọc: " + e.error);
            isReading = false;
        };

        window.speechSynthesis.speak(speech);
    }

    function pauseSpeech() {
        if (window.speechSynthesis.speaking) {
            window.speechSynthesis.pause();
            updateStatus("⏸ Đã tạm dừng.");
        }
    }

    function stopSpeech() {
        window.speechSynthesis.cancel();
        isReading = false;
        currentChunkIndex = 0;
        updateStatus("⏹ Đã dừng đọc.");
    }

    function updateStatus(msg) {
        document.getElementById("status").textContent = "Trạng thái: " + msg;
    }
</script>

</body>
</html>
