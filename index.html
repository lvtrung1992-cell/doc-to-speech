<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doc To Speech - Sách Nói Dành Cho iPhone</title>

    <!-- Thư viện đọc Word DOCX -->
    <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>

    <!-- Thư viện đọc PDF.js tương thích iOS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h1 {
            text-align: center;
            margin-top: 0;
            font-size: 24px;
            color: #333;
        }
        .file-box {
            border: 2px dashed #007aff;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            background: #f0f7ff;
        }
        .file-box input { display: none; }
        .custom-file-upload {
            display: inline-block;
            padding: 10px 20px;
            background: #007aff;
            color: white;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        #fileName {
            margin-top: 10px;
            font-weight: bold;
            color: #333;
            word-break: break-all;
        }
        textarea {
            width: 100%;
            height: 250px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            resize: vertical;
            font-size: 16px;
            line-height: 1.6;
        }
        
        #progressContainer {
            text-align: center;
            margin: 15px 0;
            color: #007aff;
        }
        #progressText {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }
        #progressBar {
            font-family: monospace;
            font-size: 18px;
            letter-spacing: 2px;
            color: #007aff;
        }

        .controls { margin-top: 15px; }
        .control-row { margin-bottom: 12px; }
        label { font-weight: bold; color: #444; }
        select, input[type="range"] {
            width: 100%;
            margin-top: 6px;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        .buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            flex: 1;
            padding: 14px 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        .play { background: #28a745; color: white; }
        .pause { background: #ffc107; color: #333; }
        .stop { background: #dc3545; color: white; }
        #status {
            margin-top: 15px;
            padding: 12px;
            background: #eef2f5;
            border-radius: 8px;
            font-size: 14px;
            color: #333;
            text-align: center;
        }
        .info { color: #666; font-size: 13px; margin-top: 6px; }
    </style>
</head>

<body>

<div class="container">
    <h1>📖 Doc To Speech</h1>

    <div class="file-box">
        <div>📂 <strong>Chọn file sách cần đọc</strong></div>
        <label for="fileInput" class="custom-file-upload">
            📁 Bấm vào đây để tải sách lên
        </label>
        <input type="file" id="fileInput" accept=".txt,.docx,.pdf">
        <div id="fileName">Chưa chọn file mới</div>
        <div class="info">Hỗ trợ: TXT, Word DOCX, PDF</div>
    </div>

    <div id="progressContainer">
        <div id="progressText">Đoạn 0 / 0</div>
        <div id="progressBar">░░░░░░░░░░░░░░░░░░░░</div>
    </div>

    <textarea id="textInput" placeholder="Nội dung sách sẽ xuất hiện dần dần ở đây..."></textarea>

    <div class="controls">
        <div class="control-row">
            <label>🌐 Ngôn ngữ đọc</label>
            <select id="language">
                <option value="auto" selected>🤖 Tự động (Thông minh: Việt/Anh)</option>
                <option value="vi-VN">🇻🇳 Tiếng Việt (Ép buộc)</option>
                <option value="en-US">🇺🇸 Tiếng Anh (Ép buộc)</option>
            </select>
        </div>
        
        <!-- THANH CHỈNH ĐỘ TRẦM ẤM MỚI -->
        <div class="control-row">
            <label>🎚️ Độ trầm ấm (Pitch): <span id="pitchValue">0.8</span></label>
            <input type="range" id="pitch" min="0.1" max="2" step="0.1" value="0.8">
            <div class="info" style="text-align:left; margin-top:3px;">* Kéo xuống dưới 1.0 để giọng ấm và trầm hơn.</div>
        </div>

        <div class="control-row">
            <label>⚡ Tốc độ đọc: <span id="speedValue">1</span>x</label>
            <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1">
        </div>
    </div>

    <div class="buttons">
        <button class="play" onclick="playSpeech()">▶ Đọc tiếp</button>
        <button class="pause" onclick="pauseSpeech()">⏸ Tạm dừng</button>
        <button class="stop" onclick="stopSpeech()">⏹ Dừng hẳn</button>
    </div>

    <div id="status">Trạng thái: Sẵn sàng...</div>
</div>

<script>
    const fileInput = document.getElementById("fileInput");
    const fileName = document.getElementById("fileName");
    const textInput = document.getElementById("textInput");
    const speedSlider = document.getElementById("speed");
    const speedValue = document.getElementById("speedValue");
    const pitchSlider = document.getElementById("pitch");
    const pitchValue = document.getElementById("pitchValue");

    let speech = null;
    let voices = [];
    let textChunks = [];
    let currentChunkIndex = 0;
    let isReading = false;

    function updateStatus(message) {
        const statusDiv = document.getElementById("status");
        if (statusDiv) {
            statusDiv.textContent = "Trạng thái: " + message;
        }
    }

    speedSlider.addEventListener("input", function() { speedValue.textContent = this.value; });
    pitchSlider.addEventListener("input", function() { pitchValue.textContent = this.value; });

    // 1. TÍNH NĂNG TRÍ NHỚ
    window.onload = function() {
        const savedText = localStorage.getItem("dts_saved_text");
        const savedIndex = localStorage.getItem("dts_saved_index");
        
        if (savedText) {
            textInput.value = savedText;
            textChunks = splitText(savedText);
            if (savedIndex) {
                currentChunkIndex = parseInt(savedIndex);
                updateProgressUI(currentChunkIndex, textChunks.length);
            }
            updateStatus("📦 Đã khôi phục sách bạn đang đọc dở.");
        }
    };

    // 2. KHI TẢI FILE MỚI
    fileInput.addEventListener("change", async function(event) {
        const file = event.target.files[0];
        if (!file) return;

        fileName.textContent = "📄 " + file.name;
        updateStatus("⏳ Đang tải file lên...");
        
        currentChunkIndex = 0;
        localStorage.setItem("dts_saved_index", 0);

        try {
            const ext = file.name.toLowerCase().split(".").pop();
            let rawText = "";

            if (ext === "txt") {
                rawText = await file.text();
            } 
            else if (ext === "docx") {
                const arrayBuffer = await file.arrayBuffer();
                const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                rawText = result.value;
            } 
            else if (ext === "pdf") {
                updateStatus("⏳ Đang giải mã PDF (Mỗi 3 trang sẽ cập nhật 1 lần)...");
                rawText = await extractPdfTextClean(file);
            }

            rawText = rawText.replace(/https?:\/\/thuviensach\.com/gi, "");
            rawText = rawText.replace(/^\s*\d+\s*$/gm, "");
            rawText = rawText.replace(/\n{3,}/g, "\n\n");

            textInput.value = rawText.trim();
            
            localStorage.setItem("dts_saved_text", textInput.value);
            textChunks = splitText(textInput.value);
            updateProgressUI(0, textChunks.length);
            updateStatus("✅ Đã chuẩn bị xong! Bấm Đọc tiếp để bắt đầu.");

        } catch (error) {
            console.error(error);
            updateStatus("❌ Lỗi khi đọc file: " + error.message);
        }
    });

    // 3. THUẬT TOÁN ĐỌC PDF THÔNG MINH
    async function extractPdfTextClean(file) {
        const arrayBuffer = await file.arrayBuffer();
        const typedarray = new Uint8Array(arrayBuffer);
        const loadingTask = pdfjsLib.getDocument({ data: typedarray });
        const pdf = await loadingTask.promise;

        let fullText = "";
        const totalPages = pdf.numPages;

        for (let i = 1; i <= totalPages; i++) {
            updateStatus(`⏳ Đang xử lý trang ${i} / ${totalPages}...`);
            
            try {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                
                let pageText = "";
                let lastY = -1;
                let lastX = -1;

                for (const item of textContent.items) {
                    if (!item.str || item.str.trim() === "") {
                        if (item.str === " ") pageText += " ";
                        continue;
                    }

                    let x = (item.transform && item.transform.length > 4) ? item.transform[4] : 0;
                    let y = (item.transform && item.transform.length > 5) ? item.transform[5] : 0;
                    let width = item.width || (item.str.length * 5);

                    if (lastY !== -1) {
                        if (Math.abs(y - lastY) > 5) {
                            pageText += "\n";
                        } else if ((x - lastX) > 3) { 
                            pageText += " ";
                        }
                    }
                    
                    pageText += item.str;
                    lastX = x + width;
                    lastY = y;
                }
                fullText += pageText + "\n\n";
            } catch (err) {
                console.warn("Lỗi nhỏ ở trang " + i, err);
            }

            if (i % 3 === 0 || i === totalPages) {
                textInput.value = fullText;
                await new Promise(r => setTimeout(r, 15)); 
            }
        }
        return fullText;
    }

    textInput.addEventListener("input", function() {
        localStorage.setItem("dts_saved_text", textInput.value);
        currentChunkIndex = 0;
        localStorage.setItem("dts_saved_index", 0);
        textChunks = splitText(textInput.value);
        updateProgressUI(0, textChunks.length);
    });

    function updateProgressUI(current, total) {
        if (total === 0) return;
        const totalBlocks = 20; 
        const filled = Math.round((current / total) * totalBlocks);
        const empty = totalBlocks - filled;
        
        const bar = "█".repeat(filled) + "░".repeat(empty);
        document.getElementById("progressText").textContent = `Đoạn ${current} / ${total}`;
        document.getElementById("progressBar").textContent = bar;
    }

    function loadVoices() { voices = window.speechSynthesis.getVoices(); }
    window.speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();

    function findVoice(lang) {
        if (!voices.length) voices = window.speechSynthesis.getVoices();
        return voices.find(v => v.lang.toLowerCase() === lang.toLowerCase()) ||
               voices.find(v => v.lang.toLowerCase().startsWith(lang.split('-')[0])) || null;
    }

    // NHẬN DIỆN NGÔN NGỮ BẰNG REGEX (Tìm xem có chứa dấu câu tiếng Việt không)
    function detectLanguage(text) {
        const vietnameseRegex = /[àáãạảăắằẵặẳâấầẫậẩđèéẽẹẻêếềễệểìíĩịỉòóõọỏôốồỗộổơớờỡợởùúũụủưứừữựửỳýỹỵỷ]/i;
        if (vietnameseRegex.test(text)) {
            return 'vi-VN';
        }
        return 'en-US';
    }

    function splitText(text, maxLength = 800) {
        text = text.replace(/\s+/g, " ").trim();
        if (!text) return [];
        if (text.length <= maxLength) return [text];

        let chunks = [];
        let remaining = text;

        while (remaining.length > maxLength) {
            let cutPos = remaining.lastIndexOf(". ", maxLength);
            if (cutPos < 200) cutPos = remaining.lastIndexOf(" ", maxLength);
            if (cutPos <= 0) cutPos = maxLength;

            chunks.push(remaining.substring(0, cutPos + 1).trim());
            remaining = remaining.substring(cutPos + 1).trim();
        }
        if (remaining) chunks.push(remaining);
        return chunks;
    }

    function playSpeech() {
        const text = textInput.value.trim();
        
        if (!text) {
            alert("Vui lòng tải sách hoặc dán chữ vào trước!");
            return;
        }

        if (window.speechSynthesis.paused && isReading) {
            window.speechSynthesis.resume();
            updateStatus("🔊 Đang đọc tiếp...");
            return;
        }

        window.speechSynthesis.cancel();
        
        if (textChunks.length === 0) {
            textChunks = splitText(text);
        }
        
        isReading = true;
        speakChunk();
    }

    function speakChunk() {
        if (currentChunkIndex >= textChunks.length || !isReading) {
            isReading = false;
            updateStatus("✅ Đã đọc xong toàn bộ cuốn sách!");
            return;
        }

        localStorage.setItem("dts_saved_index", currentChunkIndex);
        updateProgressUI(currentChunkIndex + 1, textChunks.length);
        
        const chunkText = textChunks[currentChunkIndex];
        
        // Lấy thông số từ UI
        let selectedLang = document.getElementById("language").value;
        const speed = parseFloat(speedSlider.value);
        const pitch = parseFloat(pitchSlider.value);

        // NẾU ĐỂ AUTO -> XỬ LÝ NHẬN DIỆN NGÔN NGỮ
        if (selectedLang === "auto") {
            selectedLang = detectLanguage(chunkText);
            const langName = selectedLang === 'vi-VN' ? 'Tiếng Việt' : 'Tiếng Anh';
            updateStatus(`🔊 Đang đọc (${langName})...`);
        } else {
            updateStatus("🔊 Đang đọc...");
        }

        speech = new SpeechSynthesisUtterance(chunkText);
        speech.lang = selectedLang;
        speech.rate = speed;
        speech.pitch = pitch; // Áp dụng độ trầm ấm

        const selectedVoice = findVoice(selectedLang);
        if (selectedVoice) speech.voice = selectedVoice;

        speech.onend = function() {
            currentChunkIndex++;
            speakChunk();
        };

        speech.onerror = function(e) {
            console.error(e);
            updateStatus("❌ Lỗi giọng đọc: " + e.error);
            isReading = false;
        };

        window.speechSynthesis.speak(speech);
    }

    function pauseSpeech() {
        if (window.speechSynthesis.speaking) {
            window.speechSynthesis.pause();
            updateStatus("⏸ Đã tạm dừng.");
        }
    }

    function stopSpeech() {
        window.speechSynthesis.cancel();
        isReading = false;
        updateStatus("⏹ Đã dừng lại. Bấm 'Đọc tiếp' để nghe tiếp.");
    }
</script>

</body>
</html>
