<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Doc To Speech</title>

    <!-- Mammoth.js: đọc file Word DOCX -->
    <script src="https://cdn.jsdelivr.net/npm/mammoth/mammoth.browser.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        .file-box {
            border: 2px dashed #999;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            margin-bottom: 20px;
            background: #fafafa;
        }

        .file-box input {
            margin-top: 10px;
        }

        #fileName {
            margin-top: 10px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            height: 300px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            resize: vertical;
            font-size: 16px;
            line-height: 1.6;
        }

        .controls {
            margin-top: 20px;
        }

        .control-row {
            margin-bottom: 15px;
        }

        select,
        input[type="range"] {
            width: 100%;
            margin-top: 8px;
        }

        button {
            padding: 12px 20px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .buttons {
            text-align: center;
            margin-top: 15px;
        }

        .play {
            background: #28a745;
            color: white;
        }

        .pause {
            background: #ffc107;
        }

        .stop {
            background: #dc3545;
            color: white;
        }

        #status {
            margin-top: 20px;
            padding: 12px;
            background: #f1f1f1;
            border-radius: 8px;
        }

        .info {
            color: #666;
            font-size: 14px;
            margin-top: 8px;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>📖 Doc To Speech</h1>


    <!-- ============================= -->
    <!-- CHỌN FILE -->
    <!-- ============================= -->

    <div class="file-box">

        <div>
            📂 <strong>Chọn file cần đọc</strong>
        </div>

        <input
            type="file"
            id="fileInput"
            accept=".txt,.docx,.pdf"
        >

        <div id="fileName">
            Chưa chọn file
        </div>

        <div class="info">
            Hỗ trợ: TXT, Word DOCX, PDF
        </div>

    </div>


    <!-- ============================= -->
    <!-- Ô VĂN BẢN -->
    <!-- ============================= -->

    <textarea
        id="textInput"
        placeholder="Nhập hoặc dán văn bản vào đây..."
    ></textarea>


    <!-- ============================= -->
    <!-- CÁC THIẾT LẬP -->
    <!-- ============================= -->

    <div class="controls">

        <div class="control-row">

            <label>
                🌐 Ngôn ngữ
            </label>

            <select id="language">

                <option value="vi-VN">
                    🇻🇳 Tiếng Việt
                </option>

                <option value="en-US">
                    🇺🇸 English
                </option>

                <option value="zh-CN">
                    🇨🇳 中文
                </option>

            </select>

        </div>


        <div class="control-row">

            <label>
                ⚡ Tốc độ:
                <span id="speedValue">1</span>
            </label>

            <input
                type="range"
                id="speed"
                min="0.5"
                max="2"
                step="0.1"
                value="1"
            >

        </div>

    </div>


    <!-- ============================= -->
    <!-- NÚT ĐIỀU KHIỂN -->
    <!-- ============================= -->

    <div class="buttons">

        <button
            class="play"
            onclick="playSpeech()">
            ▶ Đọc
        </button>

        <button
            class="pause"
            onclick="pauseSpeech()">
            ⏸ Tạm dừng
        </button>

        <button
            class="stop"
            onclick="stopSpeech()">
            ⏹ Dừng
        </button>

    </div>


    <!-- ============================= -->
    <!-- TRẠNG THÁI -->
    <!-- ============================= -->

    <div id="status">
        Trạng thái: Chờ thao tác...
    </div>

</div>


<!-- ================================= -->
<!-- JAVASCRIPT -->
<!-- ================================= -->

<script>

    /* =================================
       PHẦN 1
       XỬ LÝ FILE
    ================================= */

    const fileInput =
        document.getElementById("fileInput");

    const fileName =
        document.getElementById("fileName");

    const textInput =
        document.getElementById("textInput");


    fileInput.addEventListener(
        "change",
        handleFile
    );


    async function handleFile(event) {

        const file =
            event.target.files[0];

        if (!file) {
            return;
        }


        fileName.textContent =
            "📄 " + file.name;


        updateStatus(
            "⏳ Đang đọc file..."
        );


        try {

            const fileType =
                file.name
                    .toLowerCase()
                    .split(".")
                    .pop();


            /* ==========================
               FILE TXT
            ========================== */

            if (fileType === "txt") {

                const text =
                    await file.text();

                textInput.value =
                    text;

                updateStatus(
                    "✅ Đã đọc file TXT."
                );

            }


            /* ==========================
               FILE DOCX
            ========================== */

            else if (fileType === "docx") {

                const arrayBuffer =
                    await file.arrayBuffer();


                const result =
                    await mammoth.extractRawText({
                        arrayBuffer: arrayBuffer
                    });


                textInput.value =
                    result.value;


                updateStatus(
                    "✅ Đã đọc file Word DOCX."
                );

            }


            /* ==========================
               FILE PDF
            ========================== */

            else if (fileType === "pdf") {

                updateStatus(
                    "⏳ PDF sẽ được xử lý ở bước tiếp theo."
                );

                textInput.value = "";

            }


            else {

                updateStatus(
                    "❌ Loại file không được hỗ trợ."
                );

            }

        }

        catch (error) {

            console.error(error);

            updateStatus(
                "❌ Không thể đọc file."
            );

        }

    }


    /* =================================
       PHẦN 2
       TEXT TO SPEECH
    ================================= */

    let speech = null;

    let voices = [];


    function loadVoices() {

        voices =
            window.speechSynthesis.getVoices();

        console.log(
            "So luong voice:",
            voices.length
        );

    }


    window.speechSynthesis.onvoiceschanged =
        loadVoices;


    loadVoices();


    function findVoice(language) {

        if (voices.length === 0) {

            return null;

        }


        let voice =
            voices.find(function(v) {

                return v.lang.toLowerCase()
                    === language.toLowerCase();

            });


        if (voice) {

            return voice;

        }


        const shortLanguage =
            language
                .toLowerCase()
                .split("-")[0];


        voice =
            voices.find(function(v) {

                return v.lang
                    .toLowerCase()
                    .startsWith(shortLanguage);

            });


        return voice || null;

    }


    /* =================================
       TỐC ĐỘ
    ================================= */

    const speedSlider =
        document.getElementById("speed");

    const speedValue =
        document.getElementById("speedValue");


    speedSlider.addEventListener(
        "input",
        function() {

            speedValue.textContent =
                this.value;

        }
    );


    /* =================================
       ĐỌC
    ================================= */

    function playSpeech() {

        const text =
            textInput.value.trim();


        const language =
            document.getElementById(
                "language"
            ).value;


        const speed =
            parseFloat(
                speedSlider.value
            );


        if (!text) {

            alert(
                "Vui lòng nhập hoặc chọn file trước."
            );

            return;

        }


        if (
            window.speechSynthesis.paused
            && speech
        ) {

            window.speechSynthesis.resume();

            updateStatus(
                "🔊 Đang tiếp tục đọc..."
            );

            return;

        }


        window.speechSynthesis.cancel();


        if (!("speechSynthesis" in window)) {

            updateStatus(
                "❌ Trình duyệt không hỗ trợ TTS."
            );

            return;

        }


        if (voices.length === 0) {

            loadVoices();

        }


        speech =
            new SpeechSynthesisUtterance(
                text
            );


        speech.lang =
            language;


        speech.rate =
            speed;


        speech.volume =
            1;


        speech.pitch =
            1;


        const selectedVoice =
            findVoice(language);


        if (selectedVoice) {

            speech.voice =
                selectedVoice;

        }


        speech.onstart =
            function() {

                updateStatus(
                    "🔊 Đang đọc..."
                );

            };


        speech.onend =
            function() {

                updateStatus(
                    "✅ Đã đọc xong."
                );

            };


        speech.onerror =
            function(event) {

                console.error(
                    "Speech error:",
                    event.error
                );


                updateStatus(
                    "❌ Lỗi TTS: "
                    + event.error
                );

            };


        window.speechSynthesis.speak(
            speech
        );

    }


    /* =================================
       TẠM DỪNG
    ================================= */

    function pauseSpeech() {

        if (
            window.speechSynthesis.speaking
        ) {

            window.speechSynthesis.pause();

            updateStatus(
                "⏸ Đã tạm dừng."
            );

        }

    }


    /* =================================
       DỪNG
    ================================= */

    function stopSpeech() {

        window.speechSynthesis.cancel();

        speech = null;

        updateStatus(
            "⏹ Đã dừng."
        );

    }


    /* =================================
       STATUS
    ================================= */

    function updateStatus(message) {

        document.getElementById(
            "status"
        ).textContent =
            "Trạng thái: " + message;

    }

</script>


<!-- ================================= -->
<!-- PDF.JS -->
<!-- Chúng ta sẽ dùng ở bước PDF -->
<!-- ================================= -->

<script type="module">

    /*
       PDF.js sẽ được kích hoạt
       ở phần xử lý PDF tiếp theo.
    */

</script>


</body>

</html>
