<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Doc To Speech</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .app {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            color: #2563eb;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            min-height: 300px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            resize: vertical;
            font-size: 17px;
            line-height: 1.7;
            outline: none;
        }

        textarea:focus {
            border-color: #2563eb;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 15px;
            cursor: pointer;
        }

        .play {
            background: #16a34a;
            color: white;
        }

        .pause {
            background: #f59e0b;
            color: white;
        }

        .stop {
            background: #dc2626;
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }

        .settings {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 25px;
        }

        select,
        input[type="range"] {
            width: 100%;
        }

        select {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        .speed-value {
            margin-top: 5px;
            font-weight: bold;
            color: #2563eb;
        }

        .status {
            margin-top: 20px;
            padding: 12px;
            background: #f3f4f6;
            border-radius: 8px;
            color: #555;
        }

        @media (max-width: 600px) {

            .container {
                margin: 10px auto;
                padding: 10px;
            }

            .app {
                padding: 20px;
            }

            .settings {
                grid-template-columns: 1fr;
            }

            button {
                width: 100%;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="app">

            <h1>📖 Doc To Speech</h1>

            <div class="subtitle">
                Công cụ đọc văn bản thành giọng nói
            </div>

            <label for="textInput">
                Nội dung văn bản
            </label>

            <textarea
                id="textInput"
                placeholder="Hãy dán văn bản bạn muốn đọc vào đây...">
            </textarea>

            <div class="settings">

                <div>

                    <label for="language">
                        Ngôn ngữ
                    </label>

                    <select id="language">

                        <option value="vi-VN">
                            🇻🇳 Tiếng Việt
                        </option>

                        <option value="en-US">
                            🇺🇸 English
                        </option>

                        <option value="zh-CN">
                            🇨🇳 中文
                        </option>

                    </select>

                </div>

                <div>

                    <label for="speed">
                        Tốc độ đọc
                    </label>

                    <input
                        type="range"
                        id="speed"
                        min="0.5"
                        max="2"
                        step="0.1"
                        value="1">

                    <div class="speed-value">
                        <span id="speedValue">1.0</span>x
                    </div>

                </div>

            </div>

            <div class="controls">

                <button
                    class="play"
                    onclick="playSpeech()">
                    ▶ Phát
                </button>

                <button
                    class="pause"
                    onclick="pauseSpeech()">
                    ⏸ Tạm dừng
                </button>

                <button
                    class="stop"
                    onclick="stopSpeech()">
                    ⏹ Dừng
                </button>

            </div>

            <div
                class="status"
                id="status">
                Trạng thái: Sẵn sàng
            </div>

        </div>

    </div>


    <script>

    // =====================================================
    // 1. BIẾN DÙNG CHUNG
    // =====================================================

    let speech = null;

    let voices = [];


    // =====================================================
    // 2. LẤY DANH SÁCH GIỌNG ĐỌC
    // =====================================================

    function loadVoices() {

        voices = window.speechSynthesis.getVoices();

        console.log("So luong voice:", voices.length);

        for (let i = 0; i < voices.length; i++) {

            console.log(
                i + ": " +
                voices[i].name +
                " - " +
                voices[i].lang
            );

        }

    }


    // Chrome đôi khi tải voice chậm.
    // Vì vậy phải chờ sự kiện voiceschanged.

    window.speechSynthesis.onvoiceschanged =
        loadVoices;


    // Thử lấy ngay lần đầu

    loadVoices();


    // =====================================================
    // 3. TÌM GIỌNG PHÙ HỢP VỚI NGÔN NGỮ
    // =====================================================

    function findVoice(language) {

        // Nếu chưa có voice
        if (voices.length === 0) {

            return null;

        }


        // Tìm chính xác
        let voice = voices.find(
            function (v) {

                return v.lang.toLowerCase()
                    === language.toLowerCase();

            }
        );


        if (voice) {

            return voice;

        }


        // Nếu không có chính xác,
        // tìm cùng nhóm ngôn ngữ.

        let shortLanguage =
            language
                .toLowerCase()
                .split("-")[0];


        voice = voices.find(
            function (v) {

                return v.lang
                    .toLowerCase()
                    .startsWith(shortLanguage);

            }
        );


        return voice || null;

    }


    // =====================================================
    // 4. THANH ĐIỀU CHỈNH TỐC ĐỘ
    // =====================================================

    const speedSlider =
        document.getElementById("speed");


    const speedValue =
        document.getElementById("speedValue");


    speedSlider.addEventListener(
        "input",
        function () {

            speedValue.textContent =
                this.value;

        }
    );


    // =====================================================
    // 5. HÀM PHÁT
    // =====================================================

    function playSpeech() {

        const text =
            document
                .getElementById("textInput")
                .value
                .trim();


        const language =
            document
                .getElementById("language")
                .value;


        const speed =
            parseFloat(
                document
                    .getElementById("speed")
                    .value
            );


        // -------------------------------------------------
        // Kiểm tra văn bản
        // -------------------------------------------------

        if (!text) {

            alert(
                "Vui lòng nhập hoặc dán văn bản trước."
            );

            return;

        }


        // -------------------------------------------------
        // Nếu đang tạm dừng
        // -------------------------------------------------

        if (
            window.speechSynthesis.paused &&
            speech
        ) {

            window.speechSynthesis.resume();

            updateStatus(
                "Đang tiếp tục đọc..."
            );

            return;

        }


        // -------------------------------------------------
        // Dừng câu cũ
        // -------------------------------------------------

        window.speechSynthesis.cancel();


        // -------------------------------------------------
        // Kiểm tra Speech Synthesis
        // -------------------------------------------------

        if (
            !("speechSynthesis" in window)
        ) {

            updateStatus(
                "❌ Trình duyệt không hỗ trợ Text-to-Speech."
            );

            return;

        }


        // -------------------------------------------------
        // Kiểm tra voice
        // -------------------------------------------------

        if (voices.length === 0) {

            loadVoices();

        }


        // -------------------------------------------------
        // Tạo câu đọc
        // -------------------------------------------------

        speech =
            new SpeechSynthesisUtterance(text);


        // Ngôn ngữ

        speech.lang = language;


        // Tốc độ

        speech.rate = speed;


        // Âm lượng

        speech.volume = 1;


        // Độ cao giọng

        speech.pitch = 1;


        // -------------------------------------------------
        // Tìm voice
        // -------------------------------------------------

        const selectedVoice =
            findVoice(language);


        if (selectedVoice) {

            speech.voice =
                selectedVoice;


            updateStatus(
                "Đang sử dụng giọng: " +
                selectedVoice.name +
                " (" +
                selectedVoice.lang +
                ")"
            );

        }
        else {

            updateStatus(
                "⚠️ Không tìm thấy voice cho " +
                language +
                ". Đang thử voice mặc định..."
            );

        }


        // -------------------------------------------------
        // Bắt đầu đọc
        // -------------------------------------------------

        speech.onstart =
            function () {

                updateStatus(
                    "🔊 Đang đọc..."
                );

            };


        // -------------------------------------------------
        // Đọc xong
        // -------------------------------------------------

        speech.onend =
            function () {

                updateStatus(
                    "✅ Đã đọc xong."
                );

            };


        // -------------------------------------------------
        // Có lỗi
        // -------------------------------------------------

        speech.onerror =
            function (event) {

                console.error(
                    "Speech error:",
                    event.error
                );


                updateStatus(
                    "❌ Lỗi TTS: " +
                    event.error
                );

            };


        // -------------------------------------------------
        // Bắt đầu
        // -------------------------------------------------

        window.speechSynthesis.speak(
            speech
        );

    }


    // =====================================================
    // 6. TẠM DỪNG
    // =====================================================

    function pauseSpeech() {

        if (
            window.speechSynthesis.speaking
        ) {

            window.speechSynthesis.pause();

            updateStatus(
                "⏸ Đã tạm dừng."
            );

        }

    }


    // =====================================================
    // 7. DỪNG
    // =====================================================

    function stopSpeech() {

        window.speechSynthesis.cancel();

        speech = null;

        updateStatus(
            "⏹ Đã dừng."
        );

    }


    // =====================================================
    // 8. CẬP NHẬT TRẠNG THÁI
    // =====================================================

    function updateStatus(message) {

        document
            .getElementById("status")
            .textContent =
            "Trạng thái: " + message;

    }

</script>

</body>

</html>
