<div class="container">

<script>
    const fileInput = document.getElementById("fileInput");
    const fileName = document.getElementById("fileName");
    const textInput = document.getElementById("textInput");
    const speedSlider = document.getElementById("speed");
    const speedValue = document.getElementById("speedValue");
    const pitchSlider = document.getElementById("pitch");
    const pitchValue = document.getElementById("pitchValue");

    let speech = null;
    let voices = [];
    let textChunks = [];
    let currentChunkIndex = 0;
    let currentSentenceIndex = 0;
    let isReading = false;
    // ===== XỬ LÝ ĐỌC SONG NGỮ VIỆT - ANH =====
let speechParts = [];
let speechPartIndex = 0;
    // Dùng để bỏ qua sự kiện onend của câu đọc cũ
    let speechGeneration = 0;
    function updateStatus(message) {
        const statusDiv = document.getElementById("status");
        if (statusDiv) {
            statusDiv.textContent = "Trạng thái: " + message;
        }
    }

    speedSlider.addEventListener("input", function() { speedValue.textContent = this.value; });
    pitchSlider.addEventListener("input", function() { pitchValue.textContent = this.value; });

    // 1. TÍNH NĂNG TRÍ NHỚ
    window.onload = function() {
        const savedText = localStorage.getItem("dts_saved_text");
        const savedIndex = localStorage.getItem("dts_saved_index");
        
        if (savedText) {
            textInput.value = savedText;
            textChunks = splitText(savedText);
            if (savedIndex) {
                currentChunkIndex = parseInt(savedIndex);
                updateProgressUI(currentChunkIndex, textChunks.length);
            }
            updateStatus("📦 Đã khôi phục sách bạn đang đọc dở.");
        }
    };

    // 2. KHI TẢI FILE MỚI
    fileInput.addEventListener("change", async function(event) {
        const file = event.target.files[0];
        if (!file) return;

        fileName.textContent = "📄 " + file.name;
        updateStatus("⏳ Đang tải file lên...");
        
        currentChunkIndex = 0;
        currentSentenceIndex = 0;
        
        localStorage.setItem("dts_saved_index", 0);
        
        try {
            const ext = file.name.toLowerCase().split(".").pop();
            let rawText = "";

            if (ext === "txt") {
                rawText = await file.text();
            } 
            else if (ext === "docx") {
                const arrayBuffer = await file.arrayBuffer();
                const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                rawText = result.value;
            } 
            else if (ext === "pdf") {
                updateStatus("⏳ Đang giải mã PDF (Mỗi 3 trang sẽ cập nhật 1 lần)...");
                rawText = await extractPdfTextClean(file);
            }

            rawText = rawText.replace(/https?:\/\/thuviensach\.com/gi, "");
            rawText = rawText.replace(/^\s*\d+\s*$/gm, "");
            rawText = rawText.replace(/\n{3,}/g, "\n\n");

            textInput.value = rawText.trim();
            
            localStorage.setItem("dts_saved_text", textInput.value);
            textChunks = splitText(textInput.value);
            updateProgressUI(0, textChunks.length);
            updateStatus("✅ Đã chuẩn bị xong! Bấm Đọc tiếp để bắt đầu.");

        } catch (error) {
            console.error(error);
            updateStatus("❌ Lỗi khi đọc file: " + error.message);
        }
    });

    // 3. THUẬT TOÁN ĐỌC PDF THÔNG MINH
    async function extractPdfTextClean(file) {
        const arrayBuffer = await file.arrayBuffer();
        const typedarray = new Uint8Array(arrayBuffer);
        const loadingTask = pdfjsLib.getDocument({ data: typedarray });
        const pdf = await loadingTask.promise;

        let fullText = "";
        const totalPages = pdf.numPages;

        for (let i = 1; i <= totalPages; i++) {
            updateStatus(`⏳ Đang xử lý trang ${i} / ${totalPages}...`);
            
            try {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                
                let pageText = "";
                let lastY = -1;
                let lastX = -1;

                for (const item of textContent.items) {
                    if (!item.str || item.str.trim() === "") {
                        if (item.str === " ") pageText += " ";
                        continue;
                    }

                    let x = (item.transform && item.transform.length > 4) ? item.transform[4] : 0;
                    let y = (item.transform && item.transform.length > 5) ? item.transform[5] : 0;
                    let width = item.width || (item.str.length * 5);

                    if (lastY !== -1) {
                        if (Math.abs(y - lastY) > 5) {
                            pageText += "\n";
                        } else if ((x - lastX) > 3) { 
                            pageText += " ";
                        }
                    }
                    
                    pageText += item.str;
                    lastX = x + width;
                    lastY = y;
                }
                fullText += pageText + "\n\n";
            } catch (err) {
                console.warn("Lỗi nhỏ ở trang " + i, err);
            }

            if (i % 3 === 0 || i === totalPages) {
                textInput.value = fullText;
                await new Promise(r => setTimeout(r, 15)); 
            }
        }
        return fullText;
    }

    textInput.addEventListener("input", function() {
        localStorage.setItem("dts_saved_text", textInput.value);
        currentChunkIndex = 0;
        currentSentenceIndex = 0;
        localStorage.setItem("dts_saved_index", 0);
        textChunks = splitText(textInput.value);
        updateProgressUI(0, textChunks.length);
    });

    function updateProgressUI(current, total) {
        if (total === 0) return;
        const totalBlocks = 20; 
        const filled = Math.round((current / total) * totalBlocks);
        const empty = totalBlocks - filled;
        
        const bar = "█".repeat(filled) + "░".repeat(empty);
        document.getElementById("progressText").textContent = `Đoạn ${current} / ${total}`;
        document.getElementById("progressBar").textContent = bar;
    }

    // ===============================
// TÌM VỊ TRÍ ĐOẠN ĐANG ĐỌC
// ===============================
function findChunkPositionInOriginal(originalText, chunkText) {

    const target = chunkText.replace(/\s+/g, " ").trim();

    if (!target) return null;

    let normalized = "";
    let mapStart = [];
    let mapEnd = [];

    let i = 0;

    while (i < originalText.length) {

        // Nếu gặp khoảng trắng / xuống dòng
        if (/\s/.test(originalText[i])) {

            const start = i;

            while (
                i < originalText.length &&
                /\s/.test(originalText[i])
            ) {
                i++;
            }

            // Chỉ tạo 1 khoảng trắng
            // nếu nó nằm giữa 2 phần nội dung
            if (
                normalized.length > 0 &&
                i < originalText.length
            ) {

                normalized += " ";

                mapStart.push(start);
                mapEnd.push(i);
            }

        } else {

            normalized += originalText[i];

            mapStart.push(i);
            mapEnd.push(i + 1);

            i++;
        }
    }

    // Xóa khoảng trắng đầu/cuối
    let trimStart = 0;
    let trimEnd = normalized.length;

    while (
        trimStart < trimEnd &&
        normalized[trimStart] === " "
    ) {
        trimStart++;
    }

    while (
        trimEnd > trimStart &&
        normalized[trimEnd - 1] === " "
    ) {
        trimEnd--;
    }

    normalized = normalized.substring(
        trimStart,
        trimEnd
    );

    mapStart = mapStart.slice(
        trimStart,
        trimEnd
    );

    mapEnd = mapEnd.slice(
        trimStart,
        trimEnd
    );

    // Tìm đoạn đang đọc
    const position = normalized.indexOf(target);

    if (position === -1) {
        return null;
    }

    const start = mapStart[position];

    const endIndex =
        position + target.length - 1;

    const end = mapEnd[endIndex];

    return {
        start: start,
        end: end
    };
}


// ===============================
// BÔI SÁNG ĐOẠN ĐANG ĐỌC
// ===============================
function highlightCurrentChunk(sentenceText) {

    if (!sentenceText || !textInput.value) {
        return;
    }

    const fullText = textInput.value;

    // Chuẩn hóa để tìm câu
    const cleanSentence = sentenceText
        .replace(/\s+/g, " ")
        .trim();

    if (!cleanSentence) {
        return;
    }


    // ==========================================
    // TÌM CÂU TRONG TEXT GỐC
    // ==========================================

    let start = fullText.indexOf(cleanSentence);

    // Nếu không tìm thấy do xuống dòng / khoảng trắng
    if (start === -1) {

        const normalizedFullText = fullText
            .replace(/\s+/g, " ");

        const normalizedIndex =
            normalizedFullText.indexOf(cleanSentence);

        if (normalizedIndex !== -1) {

            // Chuyển vị trí normalized về vị trí thật
            start = getOriginalIndex(
                fullText,
                normalizedIndex
            );
        }
    }

    if (start === -1) {
        console.warn(
            "Không tìm thấy câu cần highlight:",
            cleanSentence
        );
        return;
    }


    const end = start + cleanSentence.length;


    // ==========================================
    // HIGHLIGHT
    // ==========================================

    try {

        textInput.focus({
            preventScroll: true
        });

    } catch (e) {

        textInput.focus();
    }

    textInput.setSelectionRange(
        start,
        end,
        "forward"
    );


    // ==========================================
    // TỰ ĐƯA CÂU ĐANG ĐỌC VÀO GIỮA
    // ==========================================

    scrollTextareaToSelection(start, end);
    setTimeout(() => {
        keepHighlightVisible();
    }, 100);
}
    function getOriginalIndex(originalText, normalizedIndex) {

    let originalIndex = 0;
    let normalizedCount = 0;

    while (
        originalIndex < originalText.length &&
        normalizedCount < normalizedIndex
    ) {

        if (/\s/.test(originalText[originalIndex])) {

            // Bỏ qua toàn bộ khoảng trắng liên tiếp
            while (
                originalIndex < originalText.length &&
                /\s/.test(originalText[originalIndex])
            ) {
                originalIndex++;
            }

            normalizedCount++;

        } else {

            originalIndex++;
            normalizedCount++;
        }
    }

    return originalIndex;
}
    function scrollTextareaToSelection(start, end) {

    const textarea = textInput;

    if (!textarea) return;


    // ==========================================
    // TÍNH CHIỀU CAO MỘT DÒNG
    // ==========================================

    const style = window.getComputedStyle(textarea);

    let lineHeight = parseFloat(style.lineHeight);

    if (!lineHeight || isNaN(lineHeight)) {
        lineHeight = parseFloat(style.fontSize) * 1.6;
    }


    // ==========================================
    // TÍNH SỐ KÝ TỰ TRÊN MỘT DÒNG
    // ==========================================

    const fontSize = parseFloat(style.fontSize) || 16;

    const charWidth = fontSize * 0.52;

    const usableWidth =
        textarea.clientWidth -
        parseFloat(style.paddingLeft || 0) -
        parseFloat(style.paddingRight || 0);


    const charsPerLine =
        Math.max(
            10,
            Math.floor(usableWidth / charWidth)
        );


    // ==========================================
    // XÁC ĐỊNH DÒNG CỦA CÂU
    // ==========================================

    const beforeText =
        textarea.value.substring(0, start);

    const linesBefore =
        beforeText.split("\n").length - 1;

    const charactersBeforeLastBreak =
        beforeText.length -
        Math.max(
            beforeText.lastIndexOf("\n"),
            0
        );


    const estimatedWrappedLines =
        Math.floor(
            charactersBeforeLastBreak /
            charsPerLine
        );


    const totalLines =
        linesBefore +
        estimatedWrappedLines;


    // ==========================================
    // ĐỘ CAO CÂU ĐANG ĐỌC
    // ==========================================

    const targetY =
        totalLines * lineHeight;


    // ==========================================
    // ĐẶT CÂU ĐANG ĐỌC Ở KHOẢNG 35%
    // ==========================================

    const targetScroll =
        targetY -
        (textarea.clientHeight * 0.35);


    const maxScroll =
        Math.max(
            0,
            textarea.scrollHeight -
            textarea.clientHeight
        );


    const finalScroll =
        Math.max(
            0,
            Math.min(
                targetScroll,
                maxScroll
            )
        );


    // ==========================================
    // IOS SAFARI
    // ==========================================

    requestAnimationFrame(() => {

        textarea.scrollTop = finalScroll;

        // iPhone đôi khi cần thêm một lần
        // sau khi selection đã được render
        setTimeout(() => {

            textarea.scrollTop = finalScroll;

        }, 60);

    });
}
    function keepHighlightVisible() {

    const textarea = textInput;

    if (!textarea) return;

    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;

    if (
        start == null ||
        end == null ||
        start === end
    ) {
        return;
    }

    scrollTextareaToSelection(start, end);
}
    function loadVoices() { voices = window.speechSynthesis.getVoices(); }
    window.speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();

    function findVoice(lang) {

    if (!voices.length) {
        voices = window.speechSynthesis.getVoices();
    }

    const targetLang = lang.toLowerCase();

    // Ưu tiên đúng ngôn ngữ
    const exactVoices = voices.filter(v =>
        v.lang &&
        v.lang.toLowerCase() === targetLang
    );

    if (exactVoices.length > 0) {

        // Nếu iPhone có voice tên Linh thì ưu tiên Linh
        if (targetLang === "vi-vn") {
            const linhVoice = exactVoices.find(v =>
                /linh/i.test(v.name)
            );

            if (linhVoice) {
                return linhVoice;
            }
        }

        // Ưu tiên voice local
        const localVoice = exactVoices.find(v =>
            v.localService === true
        );

        if (localVoice) {
            return localVoice;
        }

        return exactVoices[0];
    }

    // Không có đúng locale -> tìm theo ngôn ngữ
    const baseVoices = voices.filter(v =>
        v.lang &&
        v.lang.toLowerCase().startsWith(
            targetLang.split("-")[0]
        )
    );

    if (baseVoices.length > 0) {

        if (targetLang === "vi-vn") {
            const linhVoice = baseVoices.find(v =>
                /linh/i.test(v.name)
            );

            if (linhVoice) {
                return linhVoice;
            }
        }

        return baseVoices.find(v =>
            v.localService === true
        ) || baseVoices[0];
    }

    return null;
}

    // NHẬN DIỆN NGÔN NGỮ BẰNG REGEX (Tìm xem có chứa dấu câu tiếng Việt không)
    function detectLanguage(text) {
        const vietnameseRegex = /[àáãạảăắằẵặẳâấầẫậẩđèéẽẹẻêếềễệểìíĩịỉòóõọỏôốồỗộổơớờỡợởùúũụủưứừữựửỳýỹỵỷ]/i;
        if (vietnameseRegex.test(text)) {
            return 'vi-VN';
        }
        return 'en-US';
    }

// Không cần Internet, không cần API.

const commonVietnameseNoAccent = new Set([

    "tren", "duoc", "khong", "co", "de", "voi",

    "sach", "truyen", "chuong", "noi", "dung",

    // ============================================================
// CHIA MỘT CÂU THÀNH CÁC ĐOẠN VIỆT / ANH
// ============================================================

    // ============================================================
// NHẬN DIỆN VIỆT / ANH AN TOÀN HƠN
//

function hasVietnameseCharacters(text) {

    return /[àáạảãăắằặẳẵâấầậẩẫđèéẹẻẽêếềệểễìíịỉĩòóọỏõôốồộổỗơớờợởỡùúụủũưứừựửữỳýỵỷỹ]/i.test(text);

}


function escapeRegex(text) {

    return text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}


function containsStrongEnglishPhrase(text) {

    const lower = text.toLowerCase();

    for (const phrase of englishPhrases) {

        const pattern =
            new RegExp(
                "\\b" +
                escapeRegex(phrase) +
                "\\b",
                "i"
            );

        if (pattern.test(lower)) {
            return true;
        }
    }

    return false;
}


function containsStrongEnglishWord(text) {

    const lower = text.toLowerCase();

    for (const word of strongEnglishWords) {

        const pattern =
            new RegExp(
                "\\b" +
                escapeRegex(word) +
                "\\b",
                "i"
            );

        if (pattern.test(lower)) {
            return true;
        }
    }

    return false;
}

    function splitMixedLanguage(text) {

    if (!text || !text.trim()) {
        return [];
    }

    // Nếu toàn bộ câu không có ký tự tiếng Việt
    // thì coi là tiếng Anh
    if (!hasVietnameseCharacters(text)) {
        return [
            {
                text: text,
                lang: "en-US"
            }
        ];
    }

    let parts = [
        {
            text: text,
            lang: "vi-VN"
        }
    ];


    // ==========================================
    // HAM CHIA THEO REGEX
    // ==========================================

    function splitByRegex(parts, regex, lang) {

        const newParts = [];

        for (const part of parts) {

            if (part.lang !== "vi-VN") {
                newParts.push(part);
                continue;
            }

            let lastIndex = 0;
            let match;

            regex.lastIndex = 0;

            while ((match = regex.exec(part.text)) !== null) {

                const start = match.index;
                const end = start + match[0].length;

                if (start > lastIndex) {
                    newParts.push({
                        text: part.text.substring(lastIndex, start),
                        lang: "vi-VN"
                    });
                }

                newParts.push({
                    text: match[0],
                    lang: lang
                });

                lastIndex = end;
            }

            if (lastIndex < part.text.length) {
                newParts.push({
                    text: part.text.substring(lastIndex),
                    lang: "vi-VN"
                });
            }
        }

        return newParts;
    }


    // ==========================================
    // 1. CUM TIENG ANH
    // ==========================================

    const phraseList = [
        ...englishPhrases,
        ...englishPlaces,
        ...englishOrganizations
    ];

    for (const phrase of phraseList) {

        const regex = new RegExp(
            "(^|[^A-Za-zÀ-ỹ])" +
            escapeRegex(phrase) +
            "(?=$|[^A-Za-zÀ-ỹ])",
            "gi"
        );

        parts = splitByRegex(parts, regex, "en-US");
    }


    // ==========================================
    // 2. TEN NGUOI
    // ==========================================

    for (const name of englishProperNames) {

        const regex = new RegExp(
            "(^|[^A-Za-zÀ-ỹ])" +
            escapeRegex(name) +
            "(?=$|[^A-Za-zÀ-ỹ])",
            "g"
        );

        parts = splitByRegex(parts, regex, "en-US");
    }


    // ==========================================
    // 3. HO TIENG ANH
    // ==========================================

    for (const surname of englishSurnames) {

        const regex = new RegExp(
            "(^|[^A-Za-zÀ-ỹ])" +
            escapeRegex(surname) +
            "(?=$|[^A-Za-zÀ-ỹ])",
            "g"
        );

        parts = splitByRegex(parts, regex, "en-US");
    }


    // ==========================================
    // 4. MR / MRS / DR...
    // ==========================================

    for (const title of personTitles) {

        const regex = new RegExp(
            escapeRegex(title) +
            "\\s+[A-Z][a-z]+(?:\\s+[A-Z][a-z]+)?",
            "g"
        );

        parts = splitByRegex(parts, regex, "en-US");
    }


    // ==========================================
    // 5. GOM CAC PHAN LIEN KE CUNG NGON NGU
    // ==========================================

    const merged = [];

    for (const part of parts) {

        if (!part.text) continue;

        const last = merged[merged.length - 1];

        if (last && last.lang === part.lang) {

            last.text += part.text;

        } else {

            merged.push({
                text: part.text,
                lang: part.lang
            });

        }
    }
    for (const part of merged) {
        part.text = part.text.trim();
    }
    return merged;
}
    function splitText(text, maxLength = 800) {
        text = text.replace(/\s+/g, " ").trim();
        if (!text) return [];
        if (text.length <= maxLength) return [text];

        let chunks = [];
        let remaining = text;

        while (remaining.length > maxLength) {
            let cutPos = remaining.lastIndexOf(". ", maxLength);
            if (cutPos < 200) cutPos = remaining.lastIndexOf(" ", maxLength);
            if (cutPos <= 0) cutPos = maxLength;

            chunks.push(remaining.substring(0, cutPos + 1).trim());
            remaining = remaining.substring(cutPos + 1).trim();
        }
        if (remaining) chunks.push(remaining);
        return chunks;
    }
    // ===============================
// TÁCH CÂU TRONG MỘT ĐOẠN
// ===============================
function getSentences(text) {

    const sentences = [];

    const regex =
        /[^.!?。！？]+[.!?。！？]+|[^.!?。！？]+$/g;

    let match;

    while ((match = regex.exec(text)) !== null) {

        const sentenceText =
            match[0].trim();

        if (!sentenceText) continue;

        const leadingSpaces =
            match[0].search(/\S/);

        const start =
            match.index +
            (leadingSpaces >= 0
                ? leadingSpaces
                : 0);

        const end =
            match.index +
            match[0].length;

        sentences.push({
            text: sentenceText,
            start: start,
            end: end
        });
    }

    return sentences;
}
    function playSpeech() {
        const text = textInput.value.trim();
        
        if (!text) {
            alert("Vui lòng tải sách hoặc dán chữ vào trước!");
            return;
        }

        if (window.speechSynthesis.paused && isReading) {
            window.speechSynthesis.resume();
            updateStatus("🔊 Đang đọc tiếp...");
            return;
        }

        window.speechSynthesis.cancel();
        
        if (textChunks.length === 0) {
            textChunks = splitText(text);
        }
        
        isReading = true;
        speakChunk();
    }

    function speakChunk() {

    if (
        currentChunkIndex >= textChunks.length ||
        !isReading
    ) {
        isReading = false;
        updateStatus("✅ Đã đọc xong toàn bộ cuốn sách!");
        return;
    }

    localStorage.setItem(
        "dts_saved_index",
        currentChunkIndex
    );

    updateProgressUI(
        currentChunkIndex + 1,
        textChunks.length
    );

    const chunkText =
        textChunks[currentChunkIndex];

    // ==========================================
    // LẤY CÂU HIỆN TẠI
    // ==========================================

    const sentences = getSentences(chunkText);

    if (sentences.length === 0) {
        currentChunkIndex++;
        currentSentenceIndex = 0;
        speakChunk();
        return;
    }

    if (
        currentSentenceIndex >= sentences.length
    ) {
        currentSentenceIndex = 0;
    }

    const speechText =
    sentences[currentSentenceIndex].text;

    // ==========================================
    // HIGHLIGHT + CUỘN
    // ==========================================

    highlightCurrentChunk(
        sentences[currentSentenceIndex].text
    );

    // ==========================================
    // THÔNG SỐ
    // ==========================================

    const selectedLang =
        document.getElementById("language").value;

    const speed =
        parseFloat(speedSlider.value);

    const pitch =
        parseFloat(pitchSlider.value);

    // ==========================================
    // CHIA VIỆT / ANH
    // ==========================================

    if (selectedLang === "auto") {

        try {

            speechParts =
                splitMixedLanguage(speechText);

        } catch (error) {

            console.error(
                "LỖI splitMixedLanguage:",
                error
            );

            updateStatus(
                "❌ Lỗi nhận diện ngôn ngữ: " +
                error.message
            );

            isReading = false;

            return;
        }

    } else {

        // Nếu người dùng ép ngôn ngữ
        speechParts = [{
            text: speechText,
            lang: selectedLang
        }];
    }

    speechPartIndex = 0;

    if (speechParts.length === 0) {
        currentChunkIndex++;
        currentSentenceIndex = 0;
        speakChunk();
        return;
    }

    updateStatus(
        "🔊 Đang đọc thông minh Việt - Anh..."
    );

    // ==========================================
    // BẮT ĐẦU ĐỌC
    // ==========================================

    speakNextPart(speed, pitch);
}
    function speakNextPart(speed, pitch) {

    if (!isReading) {
        return;
    }

    // Đã đọc hết các đoạn Việt/Anh
    if (speechPartIndex >= speechParts.length) {

        currentChunkIndex++;
        currentSentenceIndex = 0;

        speechParts = [];
        speechPartIndex = 0;

        speakChunk();
        return;
    }

    const part =
        speechParts[speechPartIndex];

    const partText =
        part.text.trim();

    if (!partText) {
        speechPartIndex++;
        speakNextPart(speed, pitch);
        return;
    }

    const partLang =
        part.lang;

    // ==========================================
    // TẠO UTTERANCE
    // ==========================================

    speech =
        new SpeechSynthesisUtterance(partText);

    speech.lang = partLang;
    speech.rate = speed;
    speech.pitch = pitch;

    // ==========================================
    // CHỌN VOICE
    // ==========================================

    const selectedVoice =
        findVoice(partLang);

    if (selectedVoice) {
        speech.voice = selectedVoice;
    }

    // ==========================================
    // CHỐNG EVENT CŨ
    // ==========================================

    speech.generation =
        speechGeneration;

    // ==========================================
    // STATUS
    // ==========================================

    if (partLang === "en-US") {

        updateStatus(
            "🔊 English: " + partText.substring(0, 35) +
            (partText.length > 35 ? "..." : "")
        );

    } else {

        updateStatus(
            "🔊 Tiếng Việt..."
        );
    }

    // ==========================================
    // ĐỌC XONG PHẦN NÀY
    // ==========================================

    speech.onend = function() {

    if (
        !isReading ||
        this.generation !== speechGeneration
    ) {
        return;
    }

    // ==========================================
    // ĐÃ ĐỌC XONG 1 PHẦN VIỆT / ANH
    // ==========================================

    speechPartIndex++;

    // Nếu câu hiện tại vẫn còn phần Việt/Anh khác
    // thì đọc tiếp phần kế tiếp của cùng câu
    if (speechPartIndex < speechParts.length) {

        setTimeout(function() {

            if (!isReading) return;

            speakNextPart(
                speed,
                pitch
            );

        }, 20);

        return;
    }

    // ==========================================
    // ĐÃ ĐỌC XONG TOÀN BỘ CÂU HIỆN TẠI
    // ==========================================

    const chunkText =
        textChunks[currentChunkIndex];

    const sentences =
        getSentences(chunkText);

    // ------------------------------------------
    // CÒN CÂU TIẾP THEO TRONG CÙNG ĐOẠN
    // ------------------------------------------

    if (
        currentSentenceIndex <
        sentences.length - 1
    ) {

        currentSentenceIndex++;

        speechParts = [];
        speechPartIndex = 0;

        setTimeout(function() {

            if (!isReading) return;

            speakChunk();

        }, 20);

        return;
    }

    // ==========================================
    // ĐÃ HẾT CÂU TRONG ĐOẠN
    // → CHUYỂN SANG ĐOẠN TIẾP THEO
    // ==========================================

    currentChunkIndex++;
    currentSentenceIndex = 0;

    speechParts = [];
    speechPartIndex = 0;

    setTimeout(function() {

        if (!isReading) return;

        speakChunk();

    }, 20);
};

    // ==========================================
    // LỖI
    // ==========================================

    speech.onerror = function(e) {

    console.error(
        "Speech error:",
        e.error,
        e
    );

    if (
        e.error === "canceled" ||
        e.error === "interrupted"
    ) {
        return;
    }

    updateStatus(
        "❌ Lỗi giọng đọc: " +
        e.error
    );

    isReading = false;
};

    // ==========================================
    // ĐỌC
    // ==========================================

    window.speechSynthesis.speak(
        speech
    );
}

// ⏭ CÂU TIẾP
// ========================================
function goToNextSentence() {

    if (!textChunks.length) {
        return;
    }

    const chunkText =
        textChunks[currentChunkIndex];

    const sentences =
        getSentences(chunkText);

    if (!sentences.length) {
        return;
    }

    // Nếu vẫn còn câu phía sau
    if (
        currentSentenceIndex <
        sentences.length - 1
    ) {

        currentSentenceIndex++;

        window.speechSynthesis.cancel();

        speechGeneration++;
        speechParts = [];
        speechPartIndex = 0;

        isReading = true;
        speakChunk();

        return;
    }

    // Đã đến câu cuối của đoạn
    // → chuyển sang đoạn kế tiếp
    if (
        currentChunkIndex <
        textChunks.length - 1
    ) {

        currentChunkIndex++;

        currentSentenceIndex = 0;

        window.speechSynthesis.cancel();

        speechGeneration++;
        speechParts = [];
        speechPartIndex = 0;

        isReading = true;
        speakChunk();

        return;
    }

    updateStatus("✅ Đã đến cuối sách.");
}


// ========================================
// ⏮ CÂU TRƯỚC
// ========================================
function goToPreviousSentence() {

    if (!textChunks.length) {
        return;
    }

    const chunkText =
        textChunks[currentChunkIndex];

    const sentences =
        getSentences(chunkText);

    if (!sentences.length) {
        return;
    }

    // Vẫn còn câu phía trước
    if (currentSentenceIndex > 0) {

        currentSentenceIndex--;

        window.speechSynthesis.cancel();

        speechGeneration++;
        speechParts = [];
        speechPartIndex = 0;

        isReading = true;
        speakChunk();

        return;
    }

    // Nếu đang ở câu đầu tiên của đoạn
    // → quay về đoạn trước
    if (currentChunkIndex > 0) {

        currentChunkIndex--;

        const previousChunk =
            textChunks[currentChunkIndex];

        const previousSentences =
            getSentences(previousChunk);

        currentSentenceIndex =
            Math.max(
                0,
                previousSentences.length - 1
            );

        window.speechSynthesis.cancel();

        speechGeneration++;
        speechParts = [];
        speechPartIndex = 0;

        isReading = true;
        speakChunk();

        return;
    }

    updateStatus("ℹ️ Bạn đang ở đầu sách.");
}


// ========================================
// ⏭ ĐOẠN TIẾP
// ========================================
function goToNextChunk() {

    if (!textChunks.length) {
        return;
    }

    if (
        currentChunkIndex >=
        textChunks.length - 1
    ) {

        updateStatus("✅ Đã đến đoạn cuối sách.");

        return;
    }

    currentChunkIndex++;

    currentSentenceIndex = 0;

    window.speechSynthesis.cancel();

    speechGeneration++;
    speechParts = [];
    speechPartIndex = 0;

    isReading = true;
    speakChunk();
}
    function pauseSpeech() {
        if (window.speechSynthesis.speaking) {
            window.speechSynthesis.pause();
            updateStatus("⏸ Đã tạm dừng.");
        }
    }

    function stopSpeech() {
        window.speechSynthesis.cancel();
        isReading = false;
        updateStatus("⏹ Đã dừng lại. Bấm 'Đọc tiếp' để nghe tiếp.");
    }
</script>
